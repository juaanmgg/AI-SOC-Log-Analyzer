[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-log-analyzer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.2.22",
    "langchain-groq>=1.1.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "requests>=2.32.4",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ai_soc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=src/ai_soc --cov-report=term-missing --cov-fail-under=80"

